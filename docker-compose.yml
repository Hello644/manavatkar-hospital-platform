services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospital}
      POSTGRES_USER: ${POSTGRES_USER:-hospital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospital} -d ${POSTGRES_DB:-hospital}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Force production posture in the container regardless of .env: DEBUG off
      # (which turns on the secure-secret guard, secure cookies and TLS redirect
      # in settings.py). Override here only for a deliberate debug build.
      DJANGO_DEBUG: "0"
      DATABASE_URL: postgres://${POSTGRES_USER:-hospital}:${POSTGRES_PASSWORD:-change-this-db-password}@db:5432/${POSTGRES_DB:-hospital}
      DJANGO_ALLOWED_HOSTS: ${PUBLIC_DOMAIN:-localhost},www.${PUBLIC_DOMAIN:-localhost},${LAN_HOSTNAME:-hms.hospital.lan},localhost,127.0.0.1,web
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${PUBLIC_DOMAIN:-localhost},https://www.${PUBLIC_DOMAIN:-localhost},https://${LAN_HOSTNAME:-hms.hospital.lan}
      # Hostnames that serve the PUBLIC WEBSITE ONLY. Requests arriving on these
      # are refused anything outside the public site by
      # apps.site.middleware.PublicSiteIsolationMiddleware. The LAN hostname is
      # deliberately absent — that is the one that gets the clinical app.
      PUBLIC_SITE_HOSTS: ${PUBLIC_DOMAIN:-localhost},www.${PUBLIC_DOMAIN:-localhost}
      FACE_SERVICE_URL: ${FACE_SERVICE_URL:-http://facesvc:8080}
      KIOSK_DEVICE_TOKEN: ${KIOSK_DEVICE_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      LAN_HOSTNAME: ${LAN_HOSTNAME:-hms.hospital.lan}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  facesvc:
    build: ./facesvc
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hospital}:${POSTGRES_PASSWORD:-change-this-db-password}@db:5432/${POSTGRES_DB:-hospital}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persist the auto-downloaded buffalo_l models across restarts.
      - face_models:/root/.insightface

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospital}
      POSTGRES_USER: ${POSTGRES_USER:-hospital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ops/backup:/backup-scripts:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "/backup-scripts/backup-loop.sh"]

volumes:
  postgres_data:
  media_data:
  backup_data:
  caddy_data:
  caddy_config:
  face_models:

